[package]
name = "idlc"
description = "The ASPIS IDL compiler's command-line tool: check, build, lock, canon and rust (ADR 0067)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
# Tests are declared below, not discovered: iCloud's conflict copies, such
# as "tests/cli 2.rs", would otherwise be built as test targets. Declare
# each new file in tests/ here.
autotests = false

[lints]
workspace = true

[dependencies]
abnf.workspace = true
idl.workspace = true
idl-rt.workspace = true

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "minors"
path = "tests/minors.rs"
