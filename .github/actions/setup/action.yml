name: Set up the ASPIS build
description: >-
  Rust as rust-toolchain.toml pins it, mtools, QEMU 11.1.3 with its EDK2
  firmware, and GRUB 2.14 arm64-efi (ADRs 0035 and 0036), cached between runs.

inputs:
  qemu:
    description: Whether to set up QEMU and GRUB, for jobs that boot ASPIS.
    default: "true"

runs:
  using: composite
  steps:
    - name: Rust
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        # Installs the pinned toolchain, targets and components.
        rustup toolchain install
        rustc --version

    # Both lock files: `cargo xtask test` and `lint` build the fuzz
    # workspace's harness too (ADR 0068, rule 7).
    - name: Cargo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'rust-toolchain.toml') }}

    - name: Packages
      if: inputs.qemu == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq mtools libslirp0 libpixman-1-0 libpng16-16t64 libglib2.0-0t64 libfdt1

    - name: QEMU cache
      if: inputs.qemu == 'true'
      id: qemu-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/qemu
        key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/build-qemu.sh') }}

    - name: Build QEMU
      if: inputs.qemu == 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get install -y -qq build-essential ninja-build pkg-config python3-venv \
          libglib2.0-dev libpixman-1-dev libslirp-dev libpng-dev libfdt-dev flex bison bzip2
        sh tools/ci/build-qemu.sh "$HOME/qemu"

    - name: QEMU on the path
      if: inputs.qemu == 'true'
      shell: bash
      run: echo "$HOME/qemu/bin" >> "$GITHUB_PATH"

    - name: GRUB cache
      if: inputs.qemu == 'true'
      id: grub-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/grub/BOOTAA64.EFI
        key: grub-${{ runner.arch }}-${{ hashFiles('tools/grub/**') }}

    - name: Build GRUB
      if: inputs.qemu == 'true' && steps.grub-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo xtask grub
