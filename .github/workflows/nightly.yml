# The nightly QEMU matrix (C68; ADR 0036, rule 4): each CPU with each GIC,
# at 1, 4 and 8 cores and 1 and 3 GiB, plus a run with the firmware at EL2.
# Beside it, the nightly fuzzing (C71; ADR 0068, rule 8): every fuzz
# target for 10 minutes on the merged, cached corpus, in two shards, and
# the ABNF differential on 20,000 generated cases; and TLC with the nightly
# constants (C12, C14; ADR 0068, rule 10), after crates/ksched's and
# crates/kipc's seeded host tests at 20 times their per-change runs.

name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: QEMU matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: cargo xtask matrix

  # Every fuzz target for 10 minutes of fuzzing, on the corpus the last
  # night saved (docs/design/call-language.md, "Nightly"), in a matrix of
  # two shards: `--shard i/2` runs every second target from the i-th, 7
  # and 7 of the 14. The harness merges each target's corpus after its
  # run, and each shard saves its own targets' corpora under its own
  # cache key, for the next night and for every pull request's replay,
  # which restores both. `--budget 4200` caps a shard's fuzzing at 70
  # minutes: up to 7 targets a shard get 10 minutes each, and each one
  # more shortens the others' share. Corpus loads, merges, the builds and
  # coverage come on top. A third shard comes when a shard's share gets
  # too short (docs/design/call-language.md, "Seams for later",
  # `--shard`; `tests/harness.rs`'s `nightly_shards` fails then).
  # The step's own timeout fails the step, rather than canceling the job,
  # so the corpus, coverage and findings are still saved.
  #
  # Until ASPIS's first release, findings are fixed in the open: the
  # findings and logs uploaded here are public for 7 days, and the job's
  # own log, with its backtraces, for the repository's 90-day log
  # retention (ADR 0068, rule 13; SECURITY.md). From the
  # first release, a `--redact` mode prints only each target's crash
  # count, and the findings are encrypted with `age` to the triagers' keys
  # and kept for 1 day ("Triage and disclosure"). It isn't built yet.
  #
  # The in-QEMU kernel-call fuzzer joins as a job of its own,
  # `kernel-calls`, once the kernel interfaces' IDL and the interface
  # library exist (C07 and C17; ADR 0068, rule 11).
  fuzz:
    name: Fuzz targets (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          qemu: "false"
      - name: Fuzzing tools' pins
        id: pins
        run: echo "hash=$(grep -E '^cargo-(fuzz|deny) *=' fuzz/Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Fuzzing tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/bin/cargo-deny
          key: fuzz-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.hash }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: cargo xtask fuzz install
      # Both shards' caches (`v2` keys, apart from the unsharded `v1`
      # cache), as the per-change job restores them: the second restore
      # adds its directories beside the first's. Then only the shard's own
      # targets' directories are kept, so it replays and saves only those,
      # and a target that moves to the other shard, when a row is inserted
      # mid-table, takes its corpus with it. A third shard adds a restore
      # step here and in ci.yml's fuzz job.
      - name: Fuzz corpus (shard 1)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-v2-s1-none
          restore-keys: fuzz-corpus-v2-s1-
      - name: Fuzz corpus (shard 2)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-v2-s2-none
          restore-keys: fuzz-corpus-v2-s2-
      - name: Keep the shard's own corpora
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          keep="$(cargo xtask fuzz list --shard "$SHARD/2" --names)"
          mkdir -p build/fuzz/corpus
          for d in build/fuzz/corpus/*/; do
            [ -d "$d" ] || continue
            grep -qxF "$(basename "$d")" <<< "$keep" || rm -rf "$d"
          done
      # The seed is the run number, printed, so `cargo xtask fuzz run
      # <target> --time 600 --jobs 4 --seed <n>` repeats a target's run.
      - name: Fuzz the shard's targets
        timeout-minutes: 100
        env:
          SEED: ${{ github.run_number }}
          SHARD: ${{ matrix.shard }}
        run: |
          [ -x /usr/bin/time ] || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends time; }
          cargo xtask fuzz nightly --shard "$SHARD/2" --time 600 --budget 4200 --jobs "$(nproc)" --seed "$SEED"
      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          # With the attempt, since a re-run keeps its run_id and a cache
          # key can't be saved twice.
          key: fuzz-corpus-v2-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Coverage and run records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-coverage-${{ matrix.shard }}
          path: |
            build/fuzz/coverage/summary.md
            build/fuzz/coverage/*/report.txt
            build/fuzz/coverage/*/summary.json
            build/fuzz/coverage/crates/*/report.txt
            build/fuzz/runs
          retention-days: 14
          if-no-files-found: ignore
      - name: Findings
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.shard }}
          path: |
            build/fuzz/artifacts
            build/fuzz/logs
          retention-days: 7
          if-no-files-found: ignore

  # The two ABNF checkers on 20,000 generated grammars and their inputs
  # (ADR 0068, rule 6; "Differential tests"). The seed is the run
  # number, so `cargo xtask fuzz differential --seed <n> --cases 20000`
  # repeats it. `--budget 2400` stops starting batches after 40 minutes,
  # so the run reports what it has, and the step's timeout fails the step
  # rather than canceling the job, so the cases are still uploaded.
  abnf-differential:
    name: ABNF differential
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          qemu: "false"
      - name: The ABNF differential
        timeout-minutes: 50
        env:
          SEED: ${{ github.run_number }}
        run: |
          python3 -c 'import ensurepip' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv; }
          python3 -m venv "$RUNNER_TEMP/abnf"
          "$RUNNER_TEMP/abnf/bin/pip" install --quiet abnf==2.9.1
          ASPIS_PYTHON="$RUNNER_TEMP/abnf/bin/python" cargo xtask fuzz differential --seed "$SEED" --cases 20000 --budget 2400
      - name: Disagreements
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abnf-differential
          path: build/fuzz/differential
          retention-days: 7
          if-no-files-found: ignore

  tlc:
    name: Model checking, nightly constants
    runs-on: ubuntu-24.04-arm
    # `cargo xtask tlc --nightly` stops itself at 60 minutes. The JRE is a
    # CI-only tool, as in ci.yml's tlc job.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's Java 21, with no setup action: the Temurin 21 the image
      # preinstalls (on ubuntu-24.04-arm its variable is mislabeled
      # JAVA_HOME_21_X64), else Ubuntu's own OpenJDK 21 package. xtask
      # checks the version again.
      - name: Use the runner's Java 21
        run: |
          env | grep '^JAVA_HOME' || true
          for h in $(env | sed -n 's/^JAVA_HOME_21_[A-Za-z0-9]*=//p') "${JAVA_HOME:-}"; do
            if [ -x "$h/bin/java" ] && "$h/bin/java" -version 2>&1 | grep -q '"21\.'; then
              echo "JAVA_HOME=$h" >> "$GITHUB_ENV"
              "$h/bin/java" -version
              exit 0
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openjdk-21-jre-headless
          h=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          echo "JAVA_HOME=$h" >> "$GITHUB_ENV"
          "$h/bin/java" -version
      - uses: ./.github/actions/setup
        with:
          qemu: "false"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tla/tla2tools.jar
          key: tla2tools-v1.7.4-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      - name: Seeded scheduler and IPC runs, 20 times the per-change count
        run: cargo test --locked --release -p ksched -p kipc
        env:
          KSCHED_RUNS_SCALE: "20"
      - run: cargo xtask tlc --nightly
