# Every change (C68; ADRs 0013, 0033, 0036 and 0038).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Document-only changes (Markdown files and docs/) skip the lint, test,
  # fuzz and reproducibility jobs; skipped jobs pass as required checks. If
  # this job fails, its output is empty and every job runs.
  changes:
    name: What the change touches
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.kind.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: kind
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh tools/ci/code-changed.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Licenses, sign-offs, grammars and diagrams
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: REUSE (ADR 0033, rule 3)
        run: pipx run --spec 'reuse[charset-normalizer]==6.3.0' reuse lint

      - name: Sign-offs (ADR 0033, rule 1)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tools/ci/check-dco.sh "$BASE" "$HEAD"

      - name: Grammars and their vectors (ADR 0013, rule 6)
        run: |
          python3 -m venv "$RUNNER_TEMP/abnf"
          "$RUNNER_TEMP/abnf/bin/pip" install --quiet abnf==2.9.1
          "$RUNNER_TEMP/abnf/bin/python" -I tools/ci/check-grammars.py grammars
          # The grammars idlc generates beside each IDL file (ADR 0067,
          # rule 9), with their "; uses:" grammars from grammars/.
          "$RUNNER_TEMP/abnf/bin/python" -I tools/ci/check-grammars.py --uses grammars interfaces crates/idl/tests/data/interfaces

      # The second checker of the differential pair, which also checks that
      # grammars/core.abnf matches the call-language note (ADR 0062, rule 8).
      - name: Rust toolchain for the grammar checker
        uses: ./.github/actions/setup
        with:
          qemu: "false"

      - name: Grammars and their vectors, with the Rust checker (ADR 0062, rule 8)
        run: cargo xtask grammars

      - name: Interfaces, locks and generated grammars (ADR 0067, rules 7 and 9)
        run: cargo xtask idl

      - name: Diagrams render with the newest Mermaid (ADR 0024)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/mermaid" mermaid@latest puppeteer-core@25
          git ls-files -z '*.md' | NODE_PATH="$RUNNER_TEMP/mermaid/node_modules" xargs -0 node tools/ci/check-mermaid.js

  lint:
    name: rustfmt and clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          qemu: "false"
      - run: cargo xtask lint

  test:
    name: Host and QEMU tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Host tests, the production-image check, the in-QEMU tests on the two
      # per-change configurations, a boot through GRUB on each, and a
      # forced panic (ADR 0036, rules 3 and 8).
      - run: mkdir -p build && cargo xtask test 2>&1 | tee build/test.log
        shell: bash -o pipefail {0}
      - name: Screens and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-screens
          path: |
            build/screen-*.png
            build/test.log
          if-no-files-found: ignore

  # The fuzz targets (ADR 0068, rules 6 and 7; docs/design/call-language.md,
  # "Per change"): build every target with the pinned cargo-fuzz, check
  # the oracle, replay every seed, regression and cached corpus input
  # once, fuzz the targets the change selects for 60 s each (600 s in
  # all; each after its corpus load, which comes on top), and run the
  # ABNF differential's self-test and 300 of its cases. Findings are
  # uploaded for 7 days: until the first release, fuzzing runs in public
  # and findings are fixed in the open (rule 13).
  fuzz:
    name: Fuzz targets
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          qemu: "false"
      # The tools change only when their pins do, so the key hashes the
      # pin lines, not all of fuzz/Cargo.toml.
      - name: Fuzzing tools' pins
        id: pins
        run: echo "hash=$(grep -E '^cargo-(fuzz|deny) *=' fuzz/Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Fuzzing tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/bin/cargo-deny
          key: fuzz-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.hash }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: cargo xtask fuzz install
      - run: cargo xtask fuzz build
      # The nightly's newest corpus. This job never saves it.
      - name: Fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-v1-none
          restore-keys: fuzz-corpus-v1-
      - run: cargo xtask fuzz replay
      # The seed is the run number, printed, so `cargo xtask fuzz run
      # <target> --time 60 --seed <n>` repeats a target's run.
      - name: Fuzz the targets the change selects
        # Its own limit, under the job's, so a slow run fails this step and
        # the Findings upload still runs.
        timeout-minutes: 25
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SEED: ${{ github.run_number }}
        # /usr/bin/time measures each run's CPU time.
        run: |
          [ -x /usr/bin/time ] || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends time; }
          cargo xtask fuzz smoke --base "$BASE" --seed "$SEED"
      - name: The ABNF differential (ADR 0068, rule 6)
        run: |
          python3 -c 'import ensurepip' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv; }
          python3 -m venv "$RUNNER_TEMP/abnf"
          "$RUNNER_TEMP/abnf/bin/pip" install --quiet abnf==2.9.1
          export ASPIS_PYTHON="$RUNNER_TEMP/abnf/bin/python"
          cargo xtask fuzz differential --self-test
          cargo xtask fuzz differential --seed 0 --cases 300
      - name: Findings
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            build/fuzz/artifacts
            build/fuzz/logs
            build/fuzz/differential
          retention-days: 7
          if-no-files-found: ignore

  reproducible:
    name: Reproducible images
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          qemu: "false"
      # Two builds, in different directories and as different users, must
      # give the same aspis.efi and initfs.img (ADR 0038, rule 1).
      - run: sh tools/ci/reproducible.sh
