\* Per change (CI): two contexts, so a server that runs on its own context
\* receives a call that donates nothing, and that call's reply and cancel
\* are reached, as is OneContextPerThread with a pair of contexts. The
\* invariants, the action properties and liveness.
CONSTANTS
    NT = 3
    NR = 2
    NS = 2
    TepInit = {2, 3}
    WithDestroy = FALSE
    WithSetTep = FALSE
    WithSuspend = FALSE
    Refine = FALSE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES ContextBackAtOnce WithdrawnOnlyByItsStep StrandedGetWithdrawn WalksEnd
