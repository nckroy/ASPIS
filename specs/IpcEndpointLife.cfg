\* Per change (CI): liveness, with two threads under two badges: a
\* draining endpoint is gone in the end, and a released badge's queued
\* sends are canceled in the end.
CONSTANTS
    NT = 2
    NR = 1
    Prios = {1}
    NB = 2
    WithPrio = FALSE
    WithBadge = TRUE
    WithDestroy = TRUE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES PriorityOrder CallEndsOnce OneCallEndsPerStep QueuedEndsOnce NeverSeenIfEndedFirst FaultSilent NoJoinUnderRevoked DrainEnds BadgeCancelEnds
