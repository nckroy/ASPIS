\* Per change (CI): C14's queued sends and faults (WithQueue): a send or
\* call queued, then delivered to a receiver or woken; a fault queued on
\* its fault endpoint, delivered as a donating call, and ended by a reply,
\* a cancel or a cut; timeout and context-withdrawn faults delivered plain.
\* The invariants, the action properties and liveness, in full interleaving.
CONSTANTS
    NT = 3
    NR = 2
    NS = 1
    TepInit = {2}
    WithDestroy = FALSE
    WithSetTep = FALSE
    WithSuspend = FALSE
    Refine = FALSE
    WithQueue = TRUE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES ContextBackAtOnce WithdrawnOnlyByItsStep StrandedGetWithdrawn FaultResumesSilently WalksEnd
