\* Nightly only (never in a build workflow): the refinement of the at-once
\* take-back with C14's queued sends and faults (WithQueue), where the
\* actions that would interfere with a pending walk are disabled on its
\* objects (Refine). About 70 seconds on 2 workers.
CONSTANTS
    NT = 3
    NR = 2
    NS = 1
    TepInit = {2}
    WithDestroy = FALSE
    WithSetTep = FALSE
    WithSuspend = FALSE
    Refine = TRUE
    WithQueue = TRUE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES Refinement ContextBackAtOnce WithdrawnOnlyByItsStep StrandedGetWithdrawn FaultResumesSilently
