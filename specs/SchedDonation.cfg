\* Per change (CI): a home caller and two passive servers on one context,
\* one with a timeout endpoint, in full interleaving: the invariants, the
\* action properties and liveness. Chains of two cover a mid-chain cut and
\* two take-backs on one context while a walk is pending.
CONSTANTS
    NT = 3
    NR = 2
    NS = 1
    TepInit = {2}
    WithDestroy = FALSE
    WithSetTep = FALSE
    WithSuspend = FALSE
    Refine = FALSE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES ContextBackAtOnce WithdrawnOnlyByItsStep StrandedGetWithdrawn WalksEnd
