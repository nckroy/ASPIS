\* Nightly only (never in a build workflow): C14's queued sends and faults
\* (WithQueue) with destruction and the setting and removing of timeout
\* endpoints, two of the servers with one, in full interleaving: the
\* invariants, the action properties and liveness.
CONSTANTS
    NT = 3
    NR = 2
    NS = 1
    TepInit = {2, 3}
    WithDestroy = TRUE
    WithSetTep = TRUE
    WithSuspend = FALSE
    Refine = FALSE
    WithQueue = TRUE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES ContextBackAtOnce WithdrawnOnlyByItsStep StrandedGetWithdrawn FaultResumesSilently WalksEnd
