\* Per change (CI): liveness over wait sets. One wait set of two entries on
\* one eventcount, two threads, maximum 1, with destruction: every reached
\* waiter, entry nodes included, is woken (ReachedWoken), with the
\* invariants and the action properties.
CONSTANTS
    NT = 2
    NE = 1
    NW = 1
    NI = 2
    Max = 1
    WithSets = TRUE
    WithBound = FALSE
    WithDestroy = TRUE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES CountNeverDecreases WakesOnlyReached WaitReachedReturnsAtOnce NoSpuriousReport PassiveNotWoken ReachedWoken
