\* Per change (CI): sends, calls, faults, receives, replies, cancels and
\* deadlines on one endpoint, with two priorities that change while
\* queued: the invariants and the action properties, in full interleaving.
CONSTANTS
    NT = 3
    NR = 2
    Prios = {1, 2}
    NB = 1
    WithPrio = TRUE
    WithBadge = FALSE
    WithDestroy = FALSE
SPECIFICATION Spec
INVARIANT Invariants
PROPERTIES PriorityOrder CallEndsOnce OneCallEndsPerStep QueuedEndsOnce NeverSeenIfEndedFirst FaultSilent NoJoinUnderRevoked
