# Pinned stable Rust, with no nightly features (ADR 0035, rule 1).
[toolchain]
channel = "1.100.0"
targets = ["aarch64-unknown-uefi", "aarch64-unknown-none"]
# rust-analyzer and rust-src serve editors' language servers; the build
# uses neither.
components = ["rustfmt", "clippy", "llvm-tools", "rust-analyzer", "rust-src"]
profile = "minimal"
