[package]
name = "initfs"
description = "Reader and builder for the ASPIS initial image, initfs.img (ADR 0037)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true
# Tests are declared below, not discovered: iCloud's conflict copies, such
# as "tests/reject 2.rs", would otherwise be built as test targets. Declare
# each new file in tests/ here.
autotests = false

[features]
default = []
# The image builder, which allocates.
std = []

[dependencies]
sha2 = { version = "0.11.2", default-features = false }

[dev-dependencies]
# The tests use the builder.
initfs = { path = ".", features = ["std"] }

[lints]
workspace = true

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[test]]
name = "reject"
path = "tests/reject.rs"

[[test]]
name = "robustness"
path = "tests/robustness.rs"

[[test]]
name = "roundtrip"
path = "tests/roundtrip.rs"
