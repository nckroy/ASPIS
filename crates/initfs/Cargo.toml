[package]
name = "initfs"
description = "Reader and builder for the ASPIS initial image, initfs.img (ADR 0037)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# The image builder, which allocates.
std = []

[dependencies]
sha2 = { version = "0.11.2", default-features = false }

[dev-dependencies]
# The tests use the builder.
initfs = { path = ".", features = ["std"] }

[lints]
workspace = true
