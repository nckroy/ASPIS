<title id="t">ASPIS boot logo</title>
<desc id="d">White on black. A hoplite in a crested Corinthian helmet lunges forward with his round shield, the aspis, held up in front of him at 45 degrees and a spear behind it. His head is thrown back and he shouts at the sky. To his right is the word "aspis" in lowercase geometric letters, in the style of the Apollo wordmark.</desc>
