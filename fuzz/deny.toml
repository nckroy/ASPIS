# cargo-deny's checks of the fuzz workspace, run by `cargo xtask fuzz
# build` (ADR 0068, rules 2 and 3; docs/design/call-language.md, "Engine
# and tools").

[graph]
all-features = false
# The platforms the fuzz workspace is built on: CI's runners and
# developers' Macs. Without a list, cargo-deny counts every
# target-specific dependency, including those under custom cfgs that cargo
# never builds, such as libcrux-secrets' `crabgrind` (under
# `cfg(valgrind_ct_test)`, which brings `libloading`, ISC) and libcrux's
# `hax-lib` (under `cfg(hax)`). The list keeps the check to what is built.
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[licenses]
confidence-threshold = 0.9
# The permissive licenses ADR 0008, rule 4 allows. NCSA is libFuzzer's,
# in libfuzzer-sys: it runs only in CI and on developers' machines, and is
# never linked into ASPIS code or shipped, so it is outside rule 4 (ADR
# 0068, rule 2; "CI-only tools and ADR 0008, rule 4").
allow = ["MIT", "Apache-2.0", "MPL-2.0", "BSD-3-Clause", "NCSA"]
# The list is ADR 0008's, whether or not today's lock uses each one.
unused-allowed-license = "allow"
# ASPIS's own crates (the fuzz workspace's, and the product crates it uses
# by path: abnf, kargs, idl, idl-rt, aspis-interfaces, idl-fixtures and
# aspis-crypto) are unpublished, MPL-2.0 like every ASPIS crate (ADR 0008).
private = { ignore = true }

# unicode-ident is `(MIT OR Apache-2.0) AND Unicode-3.0`: Unicode's data
# tables, inside the proc-macro stacks that libcrux-macros brings (the
# differential oracle's, ADR 0069, rule 8) and, on x86_64,
# curve25519-dalek-derive (aspis-crypto's ed25519 and x25519 families,
# through curve25519-dalek's SIMD backend). A proc macro runs only at
# build time, in CI and on developers' machines; it is never linked into
# a target and never shipped, so it is outside ADR 0008, rule 4, as NCSA
# is above. The exception names the one crate, rather than allowing the
# license for all. The project owner accepted it on 2026-11-27, with no
# change to ADR 0008.
[[licenses.exceptions]]
crate = "unicode-ident"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
